<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Fractal Price-Volume Dashboard</title>
  <desc id="desc">Dark technical banner: dual rolling Hurst signal, coupling indicator histogram, and metric callouts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/>
      <stop offset="0.5" stop-color="#0d1d2b"/>
      <stop offset="1" stop-color="#10131f"/>
    </linearGradient>
    <linearGradient id="vol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5b84b"/>
      <stop offset="1" stop-color="#f25f5c"/>
    </linearGradient>
    <linearGradient id="vlm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d6be"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
    <linearGradient id="cii" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b6cff"/>
      <stop offset="1" stop-color="#f25f5c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11202f" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0a1320" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" stroke="#1d3550" stroke-width="0.6" fill="none" opacity="0.5"/>
    </pattern>
    <style>
      .eyebrow { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #8aa3bb; letter-spacing: 0.22em; }
      .name { font: 800 58px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; fill: #f4f9ff; letter-spacing: -0.01em; }
      .role { font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c7d3e1; }
      .tagline { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #93a7bc; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #8ff2df; letter-spacing: 0.08em; }
      .micro { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #9aafc4; letter-spacing: 0.18em; }
      .metric { font: 800 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .unit { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8ff2df; letter-spacing: 0.08em; }
      .axis { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #6b829a; }
      .legend { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c7d3e1; }
      .line { stroke: #2c4760; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="520" fill="url(#bg)"/>
  <rect width="1280" height="520" fill="url(#grid)" opacity="0.65"/>

  <g transform="translate(72 64)">
    <text class="eyebrow" textLength="380" lengthAdjust="spacingAndGlyphs">FRACTAL DASHBOARD &#8226; S&amp;P 500 2015&#8212;2026</text>
    <text class="name" y="74">Volatility, Volume,</text>
    <text class="name" y="138">Persistence Together.</text>
    <text class="tagline" y="180" textLength="640" lengthAdjust="spacingAndGlyphs">Interactive explorer for the rolling Hurst pair behind the price-volume</text>
    <text class="tagline" y="206" textLength="630" lengthAdjust="spacingAndGlyphs">coupling paper. Aligned windows, block-bootstrap CIs, COVID regime overlay.</text>

    <g transform="translate(0 260)">
      <g>
        <rect width="180" height="84" rx="14" fill="url(#card)" stroke="#2c4760" filter="url(#shadow)"/>
        <text class="micro" x="18" y="26">TEMPORAL r</text>
        <text class="metric" x="18" y="58">0.665</text>
        <text class="unit" x="18" y="76">mean 49/50 equities</text>
      </g>
      <g transform="translate(196 0)">
        <rect width="180" height="84" rx="14" fill="url(#card)" stroke="#2c4760" filter="url(#shadow)"/>
        <text class="micro" x="18" y="26">CII vs ILLIQUIDITY</text>
        <text class="metric" x="18" y="58">t = 2.90</text>
        <text class="unit" x="18" y="76">p = 0.004 (2-way clustered)</text>
      </g>
      <g transform="translate(392 0)">
        <rect width="180" height="84" rx="14" fill="url(#card)" stroke="#2c4760" filter="url(#shadow)"/>
        <text class="micro" x="18" y="26">CRISIS LIFT</text>
        <text class="metric" x="18" y="58">2.0&#215;</text>
        <text class="unit" x="18" y="76">COVID coupling vs. baseline</text>
      </g>
    </g>
  </g>

  <g transform="translate(746 70)">
    <rect width="468" height="384" rx="24" fill="url(#card)" stroke="#2c4760" filter="url(#shadow)"/>
    <text class="micro" x="28" y="38">ROLLING DUAL HURST &#8212; W=500, &#916;=20</text>

    <g transform="translate(28 60)">
      <line x1="0" y1="0" x2="0" y2="190" stroke="#314c64" stroke-width="1"/>
      <line x1="0" y1="190" x2="412" y2="190" stroke="#314c64" stroke-width="1"/>

      <text class="axis" x="-6" y="6" text-anchor="end">0.85</text>
      <text class="axis" x="-6" y="100" text-anchor="end">0.70</text>
      <text class="axis" x="-6" y="194" text-anchor="end">0.50</text>

      <rect x="248" y="0" width="86" height="190" fill="#f25f5c" opacity="0.12"/>
      <text class="micro" x="291" y="14" text-anchor="middle" fill="#f25f5c">COVID</text>

      <path d="M0 84 C28 76 50 92 80 78 C118 60 148 96 178 86 C214 76 244 28 270 18 C292 10 318 32 346 46 C376 60 392 74 412 64"
            stroke="url(#vol)" stroke-width="2.6" fill="none" filter="url(#softGlow)" stroke-linecap="round"/>

      <path d="M0 132 C30 120 56 138 88 124 C124 108 156 142 188 130 C220 118 248 70 278 64 C306 58 332 84 360 96 C386 108 400 122 412 118"
            stroke="url(#vlm)" stroke-width="2.6" fill="none" filter="url(#softGlow)" stroke-linecap="round"/>

      <text class="axis" x="0" y="208">2015</text>
      <text class="axis" x="208" y="208" text-anchor="middle">2020</text>
      <text class="axis" x="412" y="208" text-anchor="end">2026</text>
    </g>

    <g transform="translate(28 282)">
      <rect width="14" height="14" rx="3" fill="url(#vol)"/>
      <text class="legend" x="22" y="12">H(|returns|)</text>
      <rect x="130" width="14" height="14" rx="3" fill="url(#vlm)"/>
      <text class="legend" x="152" y="12">H(volume)</text>
      <rect x="252" width="14" height="14" rx="3" fill="url(#cii)"/>
      <text class="legend" x="274" y="12">CII = (H_v + H_q)/2</text>
    </g>

    <g transform="translate(28 322)">
      <text class="micro" x="0" y="0">COUPLING INDICATOR DISTRIBUTION (n = 50)</text>
      <g transform="translate(0 12)">
        <rect x="0" y="22" width="22" height="14" fill="#9b6cff" opacity="0.45"/>
        <rect x="26" y="14" width="22" height="22" fill="#9b6cff" opacity="0.55"/>
        <rect x="52" y="6" width="22" height="30" fill="#9b6cff" opacity="0.7"/>
        <rect x="78" y="0" width="22" height="36" fill="#9b6cff" opacity="0.85"/>
        <rect x="104" y="2" width="22" height="34" fill="#9b6cff" opacity="0.8"/>
        <rect x="130" y="10" width="22" height="26" fill="#9b6cff" opacity="0.65"/>
        <rect x="156" y="18" width="22" height="18" fill="#9b6cff" opacity="0.5"/>
        <rect x="182" y="24" width="22" height="12" fill="#9b6cff" opacity="0.4"/>
        <rect x="208" y="28" width="22" height="8" fill="#9b6cff" opacity="0.35"/>

        <line x1="0" y1="38" x2="412" y2="38" stroke="#314c64" stroke-width="1"/>
        <text class="axis" x="0" y="52">0.6</text>
        <text class="axis" x="206" y="52" text-anchor="middle">0.75</text>
        <text class="axis" x="412" y="52" text-anchor="end">0.9</text>
      </g>
    </g>
  </g>

  <g transform="translate(72 488)">
    <text class="mono" x="0" y="0">&#10095; STREAMLIT LIVE &#8226; DFA + ROLLING + BOOTSTRAP &#8226; 50 TICKERS &#8226; DAILY OHLCV</text>
  </g>
</svg>
